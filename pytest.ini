[pytest]
filterwarnings =
    # Ignore specific DeprecationWarning from the google.protobuf library,
    # as it's an external dependency issue that will be fixed upstream.
    ignore:Type google.protobuf.pyext._message.* uses PyType_Spec:DeprecationWarning
markers =
    slow: marks tests that run full sweeps or heavy integrations (deselect with '-m \"not slow\"')
    smoke: fast end-to-end checks exercised by pre-commit (run with '-m smoke')
    critical: must-pass invariants for core stochastic/training behavior (run with '-m critical')
